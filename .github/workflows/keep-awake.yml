# Keeps the free Render instance awake (0222), so the staff site's alerts
# and morning summary run: Render puts a free web service to sleep after
# about 15 minutes with no requests, and a sleeping server checks nothing.
#
# Every 10 minutes GitHub asks the API's /api/health. Free for a public
# repository. GitHub may run a scheduled job a few minutes late, and turns
# schedules off in a repository with no commits for 60 days — re-enable it
# under Actions if that happens. An always-on Render plan makes this
# unnecessary; delete this file then.
#
# A free Render account has 750 instance-hours a month: one service kept
# awake all month uses about 744, so this works for ONE free service.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the API if it is healthy
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 90 https://gloobal-pay.onrender.com/api/health || echo 000)
          echo "HTTP $code"; cat /tmp/health.json 2>/dev/null || true
          # A 503 means the server is up but the database is not; fail the
          # run so it shows red under Actions.
          if [ "$code" != "200" ]; then exit 1; fi
