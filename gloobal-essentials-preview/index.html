<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable stop the page being pinched or
         double-tapped to zoom like a web page. This is an app shell, not a
         document: zooming it just breaks the fixed-position overlays
         (scanner, receipts, the app-map button) away from the viewport they
         are pinned to.

         Note this meta alone is NOT enough — iOS Safari has deliberately
         ignored user-scalable=no since iOS 10. It covers Android and
         desktop; the touch-action rule and the gesture handler below are
         what cover iOS. All three are needed, none is redundant. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Gloobal Access</title>
    <meta
      name="description"
      content="Cashless. Taxless. Borderless. Limitless. Register with a Secure ID, send money worldwide, link banks, and track global coverage."
    />

    <!-- Android auto-links anything it reads as a phone number, date or
         address. This app renders a lot of phone-number-shaped text, and
         auto-linking makes it look like a web page instead of an app. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

    <!-- PWA. The manifest itself is generated by vite-plugin-pwa (see
         vite.config.js) and injected here at build time. -->
    <meta name="theme-color" content="#7C3AED" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gloobal ID" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The design's display typeface (screen titles, balances, headings —
         T.fontDisplay in frontend/constants/theme.js) is Space Grotesk.
         Only the weights actually used are requested; the CSS
         font-family list falls back to the system stack if this fails.

         Space Grotesk is requested at 500/600/700 — those are the only
         weights the family has. The 800 this used to ask for does not
         exist for it and was being dropped server-side, which is why
         `fontWeight: 800` on the GLOOBAL wordmark rendered as the 700
         face. Inter is loaded alongside it purely for that wordmark
         (T.fontWordmark), which does need a real 800. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* Inlined so the very first paint — before the stylesheet and the JS
         bundle arrive — already matches the app background instead of
         flashing white. */
      html, body { margin: 0; height: 100%; background: #F6F5FC; overscroll-behavior: none; }
      /* Scrolling yes, pinch-zoom no.
         `touch-action: manipulation` (already set on body in global.css)
         only removes the double-tap delay — it still permits pinch. Naming
         the pan axes explicitly is what drops the zoom gesture while
         leaving normal one-finger scrolling untouched. */
      html, body { touch-action: pan-x pan-y; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iOS Safari's pinch-zoom, which the viewport meta above cannot
      // disable (user-scalable=no has been ignored there since iOS 10).
      // These are the non-standard WebKit gesture events, fired only for
      // multi-touch pinch/rotate — cancelling them does not affect scrolling,
      // taps, or the drag on the app-map button.
      //
      // Registered as non-passive on purpose: preventDefault() is a no-op in
      // a passive listener, and some browsers default touch listeners to
      // passive.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
        document.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
      });
      // Desktop: ctrl/⌘ + wheel is the browser's zoom shortcut, and a
      // trackpad pinch arrives as exactly that. Plain wheel scrolling is
      // left alone.
      window.addEventListener(
        'wheel',
        function (e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); },
        { passive: false }
      );
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
