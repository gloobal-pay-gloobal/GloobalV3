# Netlify configuration.
#
# The deployable app is gloobal-essentials-preview/ — a Vite SPA. Its
# `prebuild` hook runs `node ../build_app.mjs ..`, which concatenates
# backend/ and frontend/ into src/GloobalApp.jsx, so the repo root (not
# just the app folder) has to be part of the deploy context. Setting
# `base` rather than moving the app keeps that relative path working.

[build]
  base    = "gloobal-essentials-preview"
  command = "npm run build"
  # Relative to `base`, i.e. gloobal-essentials-preview/dist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Netlify defaults to `npm install`; the lockfile is committed, so use
  # the reproducible install instead.
  NPM_FLAGS = "--prefer-offline --no-audit --fund=false"

# Single-page app: every path is served by index.html and routed in the
# client. status 200 (rewrite, not redirect) so deep links keep their URL.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ────────────────────────────────────────────────────
# The CSP allowlist is derived from the origins the bundle actually
# reaches for, not copied from a template — adding one that isn't used
# weakens the policy for nothing, and omitting one that is silently
# breaks the feature:
#
#   flagcdn.com            country flag images (components/cards/flags.jsx)
#   logo.clearbit.com      bank logos (backend/data/banks.js)
#   raw.githubusercontent  earth texture for GlobeHero (components/cards/misc.jsx)
#   fonts.googleapis.com   Space Grotesk stylesheet — requested from
#                          index.html and from an @import inside the
#                          Coverage screen's inline <style>, so it must be
#                          in style-src, not just font-src
#   fonts.gstatic.com      the font files themselves
#   gloobal-pay.onrender.com   the real backend (Express + MongoDB Atlas);
#                          without it in connect-src the browser blocks
#                          every OTP/register/login/send-money call and it
#                          reads exactly like the backend being down
#
# 'unsafe-inline' in style-src is load-bearing: the screens style
# themselves with inline `style={{...}}` and embedded <style> blocks.
# script-src deliberately has no such escape — the production bundle has
# no inline scripts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    # An empty allowlist `()` disables a feature for EVERY origin, the page's
    # own included — it is not "default" or "ask the user", it is off. camera
    # and geolocation were both `()`, which meant getUserMedia rejected and
    # navigator.geolocation failed on the live site no matter what the visitor
    # chose in the browser prompt. The QR scanner could not work in production
    # however correct its code was, and the permissions gate could never get a
    # real answer for either one. `payment=(self)` on the same line was already
    # the correct shape, which is what made the other two easy to miss.
    #
    # `(self)` restores the ordinary behaviour: this origin may ASK, and the
    # browser's own permission prompt decides. It grants nothing by itself.
    # microphone stays `()` — nothing in the app records audio, and the camera
    # stream is requested with `video` only (qrScanner.jsx), so leaving it off
    # keeps the policy narrow.
    Permissions-Policy        = "camera=(self), microphone=(), geolocation=(self), payment=(self)"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy   = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://flagcdn.com https://logo.clearbit.com https://raw.githubusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://gloobal-pay.onrender.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# Everything Vite emits into /assets is content-hashed, so a new build
# produces new filenames and these can never go stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html is the one file whose URL never changes, so it must always
# be revalidated or a deploy won't reach anyone still holding the old one.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker is the one file that must never sit in an HTTP cache.
# registerType is "autoUpdate", so the browser re-fetches sw.js to notice a
# new build — a cached copy pins every installed client to the old bundle
# for as long as it lives, and there is no in-app way out of that.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type  = "application/manifest+json"

# Icons live in public/ so their names are not content-hashed — a week,
# not `immutable`, or replacing one could never reach an existing visitor.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
